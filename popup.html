<!-- The popup shown when the focus mode button is clicked -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="popup.css">
        <script src="popup.js"></script>
    </head>
    <body>
        <div id="titleDiv">
            <h1>Focus Mode</h1>
        </div>
        <div id="timeLeftSection" style="display: none;">
            <p id="timeLeft"></p>
            <input type="image" id="startTimer" src="icons/start.png" alt="Start timer">
        </div>
        <div id="addSection">
            <div class="topRow">
                <img src="icons/sleekAdd.png" id="addIcon" alt="">
                <button id="add">Add site</button>
            </div>
            <input type="text" id="addPopup" style="display: none;" placeholder="example.com">
        </div>
        <div id="removeSection">
            <div class="topRow">
                <img src="icons/sleekRemove.png" id="removeIcon" alt="">
                <button id="remove">Remove site</button>
            </div>
            <input type="text" id="removePopup" style="display: none;" placeholder="example.com" list="blockedURLs">
            <datalist id="blockedURLs"></datalist>
        </div>
        <div id="timerSection">
            <img src="icons/sleekTimer.png" id="timerIcon" alt="">
            <button id="timer">Set Timer</button>
        </div>
        <div id="timerControl">
            <form name="popup" id="popup" style="display: none;">
                <button id="1min">1 Minute</button>
                <button id="2mins">2 Minutes</button>
                <button id="5mins">5 Minutes</button>
                <button id="10mins">10 Minutes</button>
                <button id="20mins">20 Minutes</button>
                <button id="30mins">30 Minutes</button>
                <button id="45mins">45 Minutes</button>
                <button id="60mins">1 Hour</button>
            </form>
        </div>
    </body>
</html>
