<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked by Focus Mode</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #1e1e2f;
        color: #ffffff;
        display: flex;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.22);
        max-width: 440px;
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: 30px;
        line-height: 1.1;
        margin: 0 0 12px;
      }

      p {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }

      .badge {
        background: rgba(94, 234, 212, 0.12);
        border: 1px solid rgba(94, 234, 212, 0.3);
        border-radius: 8px;
        color: #5eead4;
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 18px;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Focus Mode</div>
      <h1>Focus mode is running</h1>
      <p>This site is blocked until your timer finishes.</p>
    </main>
  </body>
</html>
