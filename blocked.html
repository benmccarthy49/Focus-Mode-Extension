<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked by Focus Mode</title>
    <style>
      body {
        align-items: center;
        background: #1e1e2f;
        color: #ffffff;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }

      p {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Focus mode is running</h1>
      <p>This site is blocked until your timer finishes.</p>
    </main>
  </body>
